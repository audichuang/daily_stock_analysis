name: CI

on:
  # fork 增量：只用 push 觸發。工作分支的 push run 會掛在 PR head commit 上當 checks，
  # 再加 pull_request 等於同一個改動跑兩次（concurrency group 不同、互不取消），
  # 白佔 runner。另外不收 pull_request 也是安全邊界：job 跑在 ttnas 自架 runner
  # （掛 docker.sock），fork PR 不能觸發它。paths-filter 在 push 事件下，工作分支比對
  # default branch（develop）、develop 比對上一個 commit。main 只收發版 fast-forward，
  # 同一個 SHA 已在 develop 驗過，不重跑。
  push:
    branches: [develop, 'feat/**', 'fix/**', 'chore/**', 'docs/**', 'refactor/**', 'test/**']

# fork 增量：所有 job 跑在 ttnas 的自架 runner（label `ttnas`，Komodo stack `gh-runners`，
# 設定與 runner 端的坑在 nas-ops `hosts/ttnas/gh-runners/manifest.md`）。backend 分 4 片：
# 6 片會把 NAS 的 12 執行緒跑滿、出負載型假紅。

# fork：develop 不取消進行中的 run。paths-filter 在 develop 只比對上一個 commit，
# 合併後緊接排程的 journal push 若取消前一個 run，PR 的 web／docker 改動在 develop 上
# 就永遠沒有 web-gate／docker-build。不改成每個 SHA 一個 group：兩個 develop run 同時跑
# 等於 8 片，NAS 會滿載。殘留缺口：GitHub 每個 group 只留一個 pending run，7.5 分鐘內
# 連 push 三次，中間那次仍會被丟掉。
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' }}

jobs:
  changes:
    name: 🔎 Change Detection
    runs-on: [self-hosted, ttnas]
    # fork 增量：本仓库 default_workflow_permissions=read（仅 contents/packages），
    # dorny/paths-filter 在 pull_request 事件下要读 changed files，缺 pull-requests
    # 权限会以 "Resource not accessible by integration" 失败，导致下游 job 全部 skip。
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.backend-filter.outputs.backend_non_web == 'true' || steps.filter.outputs.backend_contract_assets == 'true' || steps.filter.outputs.backend_web_contract == 'true' }}
      docker: ${{ steps.filter.outputs.docker }}
      frontend: ${{ steps.frontend-filter.outputs.frontend_code }}
      futu_packaging: ${{ steps.filter.outputs.futu_packaging }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5
      - name: 🧭 Filter paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          predicate-quantifier: every
          filters: |
            backend_contract_assets:
              # These docs and fixtures are executable contracts consumed by
              # offline backend tests, so Markdown/docs-only changes still run them.
              - '{THIRD_PARTY_NOTICES.md,docs/CHANGELOG.md,docs/INDEX.md,docs/INDEX_EN.md,docs/DEPLOY.md,docs/DEPLOY_EN.md,docs/alerts.md,docs/analysis-context-pack.md,docs/decision-signals.md,docs/full-guide.md,docs/full-guide_EN.md,docs/notifications.md,docs/architecture/**,docs/docker/zeabur-deployment.md,tests/fixtures/**}'
            backend_web_contract:
              # Public assets are shared runtime inputs: Python loaders and
              # packaged deployments may consume them outside the Web app.
              - '{apps/dsa-web/public/**,apps/dsa-web/src/components/settings/llmProviderTemplates.ts,apps/dsa-web/src/locales/settingsHelp.ts}'
              - '!**/*.md'
            docker:
              # fork：market_data／templates 也會被 docker/Dockerfile COPY 進映像
              - '{*.py,api/**,bot/**,data_provider/**,src/**,strategies/**,market_data/**,templates/**,apps/dsa-web/**,docker/**,requirements.txt,.dockerignore,.github/workflows/ci.yml}'
              - '!**/*.md'
            futu_packaging:
              - '{requirements.txt,main.py,src/brokers/futu/**,scripts/build-backend.ps1,scripts/build-backend-macos.sh,scripts/macos-signature-audit.sh,scripts/build-all.ps1,scripts/build-all-macos.sh,apps/dsa-desktop/**,.github/workflows/ci.yml,.github/workflows/desktop-release.yml}'
              - '!**/*.md'
      - name: 🧭 Filter backend-safe frontend paths
        id: backend-filter
        uses: dorny/paths-filter@v3
        with:
          predicate-quantifier: every
          filters: |
            backend_non_web:
              - '**'
              - '!apps/dsa-web/**'
              - '!docs/**'
              - '!**/*.md'
              - '!LICENSE'
      - name: 🧭 Filter frontend code paths
        id: frontend-filter
        uses: dorny/paths-filter@v3
        with:
          predicate-quantifier: every
          filters: |
            frontend_code:
              - 'apps/dsa-web/**'
              - '!**/*.md'

  ai-governance:
    name: ai-governance
    runs-on: [self-hosted, ttnas]
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5
      - name: 🐍 Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: 🤖 Check AI governance assets
        run: python scripts/check_ai_assets.py

  backend-tests:
    name: backend-tests (${{ matrix.shard }}/4)
    runs-on: [self-hosted, ttnas]
    needs: [changes, ai-governance]
    if: needs.changes.outputs.backend == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stock_test
        # 隨機 host port：self-hosted runner 的主機上 5432 可能已被佔用。
        ports:
          - 5432
        # 資料目錄放 tmpfs：測試庫用完即丟，避免和主機上其他資料庫搶 fsync。
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # fork 增量：每個 shard 留 junit，供 scripts/ci_durations_from_junit.py 重算
      # .github/ci-test-durations.json（耗時資料過期時 shard 會嚴重失衡）。
      PYTEST_ADDOPTS: --junitxml=pytest-junit.xml
    steps:
      # ephemeral Postgres for market_data DB-backed tests (schema via Alembic)；
      # job 層 env 拿不到 job.services，只能在 step 寫進 GITHUB_ENV。
      - name: 🗄️ Point DATABASE_URL at service container
        run: echo "DATABASE_URL=postgresql+psycopg://postgres:postgres@localhost:${{ job.services.postgres.ports['5432'] }}/stock_test" >> "$GITHUB_ENV"
      - name: 📥 Checkout
        uses: actions/checkout@v5
      - name: 🐍 Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          # 不用 cache: 'pip'：那是從 GitHub 下載；ttnas runner 的 uv／pip 快取本來就在本機 volume。
      - name: 📦 Install dependencies
        run: |
          # fork 增量：先用 uv（每個 shard 省 30～50 秒），失敗才退回原本的 pip 重試迴圈。
          if python -m pip install -q uv && uv pip install --system -r .github/requirements-ci.txt; then
            exit 0
          fi
          echo "uv install failed, falling back to pip" >&2
          python -m pip install --upgrade pip
          for attempt in 1 2 3; do
            if python -m pip install -r .github/requirements-ci.txt; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Dependency install failed after ${attempt} attempts." >&2
              exit 1
            fi
            echo "Dependency install attempt ${attempt} failed, retrying in 15s..." >&2
            sleep 15
          done
      - name: 🔌 Verify global Futu SDK
        if: matrix.shard == 1
        run: python -c "import futu; print('✅ futu SDK import OK')"
      - name: ✅ Python syntax check
        if: matrix.shard == 1
        run: ./scripts/ci_gate.sh syntax
      - name: ✅ Flake8 critical checks
        if: matrix.shard == 1
        run: ./scripts/ci_gate.sh flake8
      - name: ✅ Local deterministic checks
        if: matrix.shard == 1
        run: ./scripts/ci_gate.sh deterministic
      # every shard needs the schema — the DB-backed tests are spread across all three
      - name: 🗄️ Migrate market schema (ephemeral Postgres)
        run: python -m alembic -c market_data/alembic.ini upgrade head
      - name: ✅ Offline test suite shard ${{ matrix.shard }}/4
        env:
          PYTEST_SPLITS: '4'
          PYTEST_GROUP: ${{ matrix.shard }}
          PYTEST_FIRST_SHARD_OVERHEAD: '20'
        run: ./scripts/ci_gate.sh offline-tests
      - name: 📤 Upload test timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-junit-${{ matrix.shard }}
          path: pytest-junit.xml
          retention-days: 14
          if-no-files-found: ignore

  backend-gate:
    name: backend-gate
    runs-on: [self-hosted, ttnas]
    needs: [changes, ai-governance, backend-tests]
    if: always()
    steps:
      - name: ✅ Summarize backend gate
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          AI_GOVERNANCE_RESULT: ${{ needs.ai-governance.result }}
          BACKEND_REQUIRED: ${{ needs.changes.outputs.backend }}
          BACKEND_TESTS_RESULT: ${{ needs.backend-tests.result }}
        run: |
          if [ "$CHANGES_RESULT" != "success" ] || [ "$AI_GOVERNANCE_RESULT" != "success" ]; then
            echo "Prerequisite failed: changes=$CHANGES_RESULT ai-governance=$AI_GOVERNANCE_RESULT" >&2
            exit 1
          fi
          if [ "$BACKEND_REQUIRED" = "true" ] && [ "$BACKEND_TESTS_RESULT" != "success" ]; then
            echo "Backend shards did not all pass: $BACKEND_TESTS_RESULT" >&2
            exit 1
          fi
          echo "backend-gate passed (required=$BACKEND_REQUIRED, shards=$BACKEND_TESTS_RESULT)"

  docker-build:
    name: docker-build
    runs-on: [self-hosted, ttnas]
    needs: [changes, ai-governance]
    if: needs.changes.outputs.docker == 'true'
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5
      # driver: docker 直接用 ttnas 本機 daemon 的層快取；gha 快取要經家用網路下載整份映像層（實測 456 秒）。
      - name: 🛠️ Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker
      - name: 🐳 Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          tags: stock-analysis:test
          load: true
      - name: 🐳 Docker smoke
        run: docker run --rm stock-analysis:test python -c "print('✅ Docker OK')"
      - name: 🔍 Docker smoke imports
        run: |
          docker run --rm stock-analysis:test python -c "
          from src.config import get_config; print('✅ config')
          from src.storage import DatabaseManager; print('✅ storage')
          from src.notification import NotificationService; print('✅ notification')
          from data_provider import DataFetcherManager; print('✅ data_provider')
          from src.analyzer import GeminiAnalyzer; print('✅ analyzer')
          from src.patches.eastmoney_patch import eastmoney_patch; print('✅ patch')
          from bot.dispatcher import CommandDispatcher; print('✅ bot')
          from api.app import app; print('✅ api')
          import futu; print('✅ futu')
          import market_data.db, market_data.closures, market_data.market_repo, market_data.adjust, market_data.events, market_data.funds, market_data.health, market_data.risk_flags, market_data.sources, market_data.financial_statement; print('✅ market_data')
          print('✅ All Docker imports OK')
          "

  # fork 增量：桌面打包 job（Windows、macOS）都已移除——本 fork 只發 NAS 的 Docker 映像、不發桌面版
  #（使用者 2026-10-22）。futu_packaging 過濾器留著給上游的契約測試；打包腳本仍由
  # desktop-release（手動觸發）與打包測試使用，未刪。

  web-gate:
    name: web-gate
    runs-on: [self-hosted, ttnas]
    needs: [changes, ai-governance]
    if: needs.changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: apps/dsa-web
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5
      - name: 🟢 Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          # 不用 cache: 'npm'：runner 的 npm 快取（npm_config_cache）在 ttnas 本機 volume。
      - name: 📦 Install
        run: npm ci
      - name: 🔎 Lint
        run: npm run lint
      - name: 🏗️ Build
        run: npm run build
      - name: 🌐 Install fixture browser
        run: npx playwright install --with-deps chromium
      - name: 🧪 Verify default smoke without backend credentials
        env:
          DSA_WEB_SMOKE_PASSWORD: ''
        run: npm run test:smoke
      - name: 📸 Verify deterministic UI fixtures
        run: npx playwright test --config playwright.fixture.config.ts
      - name: 📎 Upload UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-ui-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: apps/dsa-web/test-results/fixtures/
          if-no-files-found: warn
          retention-days: 30
