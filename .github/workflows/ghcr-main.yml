# Fork-only: build the Web/API image for a release tag (rel-YYYY.MM.DD[.N], cut on
# main after develop is fast-forwarded into it) and push it to GHCR so the NAS
# (Komodo) can pin it by digest. The rel- prefix keeps clear of upstream's v*.*.*
# tags, which drive the upstream release workflows (create-release.yml,
# docker-publish.yml, desktop-release.yml). Upstream publish workflows
# (docker-publish.yml, ghcr-dockerhub.yml) are left untouched.
name: GHCR Release Image

on:
  push:
    tags:
      - 'rel-*'
  workflow_dispatch:

concurrency:
  group: ghcr-main-${{ github.ref }}
  cancel-in-progress: true

env:
  GHCR_REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve image name and web build metadata
        id: vars
        run: |
          set -euo pipefail
          # GHCR image names must be lowercase.
          echo "image=${GHCR_REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=git-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          # On a rel- tag this resolves to the tag itself; dispatch falls back to describe.
          echo "web_version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
          echo "web_revision=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=raw,value=${{ steps.vars.outputs.sha_tag }}
            type=raw,value=${{ github.ref_name }},enable=${{ startsWith(github.ref, 'refs/tags/rel-') }}
          flavor: |
            latest=false

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          # Plain single-arch manifest (no attestation index) so the pushed
          # digest is exactly what the NAS pins.
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DSA_WEB_VERSION=${{ steps.vars.outputs.web_version }}
            DSA_WEB_REVISION=${{ steps.vars.outputs.web_revision }}
          cache-from: type=gha,scope=ghcr-main
          cache-to: type=gha,mode=max,scope=ghcr-main

      - name: Generate summary
        env:
          IMAGE: ${{ steps.vars.outputs.image }}
          SHA_TAG: ${{ steps.vars.outputs.sha_tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          if [[ -z "$DIGEST" ]]; then
            echo "build step produced no digest" >&2
            exit 1
          fi
          {
            echo "### GHCR release image pushed (${GITHUB_REF_NAME})"
            echo ""
            echo "- Digest: \`${DIGEST}\`"
            echo "- Pinned reference: \`${IMAGE}:${SHA_TAG}@${DIGEST}\`"
            echo "- Platform: linux/amd64"
            echo "- Tags:"
            while IFS= read -r tag; do
              [[ -n "$tag" ]] && echo "  - \`${tag}\`"
            done <<< "$TAGS"
          } >> "$GITHUB_STEP_SUMMARY"
