[flake8]
max-line-length = 120
exclude = 
    .git,
    __pycache__,
    .env,
    venv,
    .venv,
    .venv*,
    build,
    dist,
    local,
    node_modules,
    */node_modules/*,
    *.egg-info
# E501: 行太长（有些地方确实需要长行）
# W503: 运算符在换行前（与 black 冲突）
# E203: 切片前的空格（与 black 冲突）
# E402: 模块级导入不在文件顶部（有时需要先设置环境变量）
ignore = E501,W503,E203,E402

[tool:pytest]
# 兩個測試根：`tests/` 是主套件，`market_data/tests/` 是本 fork 的台股 DB 覆蓋。
# 上游只有前者——只寫 `tests` 會把 13 個檔案靜默排除在離線套件之外（不報錯、不變紅）。
testpaths = tests market_data/tests
python_files = test_*.py
python_functions = test_*
# --timeout：單一測試卡死時在 300 秒後帶著堆疊失敗，而不是無限掛住。踩過：一個沒有
# `network` marker、卻會真的連外網的測試在離線套件裡掛了 6 小時 21 分（S 狀態、只用 30 秒
# CPU、對 120.76.218.228:443 的連線 ESTABLISHED 但對方不回），全程沒有任何東西會砍它。
# 有 timeout 之後同樣的情況會紅在該測試上並印出當時的堆疊，下一次就診斷得出來。
# 需要 pytest-timeout（見 .github/requirements-ci.txt 與 AGENTS.md §4）。
addopts = -v --tb=short --timeout=300
norecursedirs =
    .git
    __pycache__
    .env
    venv
    .venv
    .venv*
    build
    dist
    local
    node_modules
    */node_modules/*
markers =
    unit: fast offline unit tests
    integration: service-level integration tests without external network dependency
    network: tests requiring external network or third-party services

[isort]
profile = black
line_length = 120
skip = .git,__pycache__,.env,venv,.venv,local,node_modules
skip_glob = */node_modules/*
known_first_party = config,storage,analyzer,notification,scheduler,search_service,market_analyzer,stock_analyzer,data_provider
