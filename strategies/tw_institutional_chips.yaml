instructions: |
  **台股法人籌碼策略(TW Institutional Chips)**

  適用範圍:僅台股(.TW / .TWO)。三大法人買賣超資料只存在於台股,
  非台股標的請完全忽略本策略,不做任何評分調整。

  資料取得:
  - 使用 `get_stock_info` 讀取法人(institution)區塊,取得近日外資/投信/自營商買賣超。
  - 若系統已在上下文注入「法人歷史趨勢」段落,優先引用其中的連續買賣超天數與趨勢方向。
  - 使用 `get_daily_history` 對照量價,使用 `search_stock_news` 查證有無個股專屬新聞。
  - 核心紀律:**不得憑籌碼數字推測原因**。查無新聞佐證時,必須明確寫出「無新聞佐證」,
    不可自行腦補利多或利空理由。

  訊號判定(依驗證強度排序):

  1. **籌碼分歧或單日轉向、無新聞 → 中性觀望(核心規則,驗證最充分)**:
     - 情境:外資與投信方向相反(例如外資大賣、投信逆勢買)、或單日買轉賣/賣轉買
       但規模與延續性不足以確認趨勢,且查無個股專屬新聞。
     - 處置:一律傾向 hold/watch,不因單一交易日的極端數字追高或減碼。
     - sentiment_score 收斂至中性區(45-55),confidence_level 不高於中等。

  2. **量價齊揚但無新聞 → 不追高**:
     - 情境:單日大漲、爆量、法人大幅買超,但查無新聞佐證。
     - 處置:不追價。sentiment_score 上限壓在 60,不建議 buy/add。
     - 例外觀察:若外資買超已連續 3 日以上且量能較前波持續放大,可註明
       「不排除趨勢啟動,建議設突破前高再評估」的複核條件,但當下仍不追高。

  3. **三方一致(價漲 + 法人連 2 日以上同向買超 + 官方等級利多新聞)→ 看多續抱**:
     - 「官方等級」指公司公告、主流媒體證實的供應鏈或營運利多,傳聞不算。
     - 已持有:傾向 hold(觀察題材延續性),sentiment_score 可上調 +5~8。
     - 未持有且短線漲幅已大(單日 >3% 或三日累計 >5%):不追高加碼,等回踩。
     - 注意:本規則目前僅單一案例驗證、信心低,只能作為「續抱的支持證據」,
       **不得作為加碼(add/buy)的觸發依據**。

  4. **持續性同步走弱 → 減碼訊號(把握度較低,須雙條件同時成立)**:
     - 條件 A:法人連續 3 個交易日以上同方向賣超(外資投信同步更強)。
     - 條件 B:價格跌破近期低點,或累積跌幅明顯(緩跌情境用累積跌幅與賣超
       延續天數判斷,不用單一價位點)。
     - A、B 同時成立才可下調 sentiment_score(-8~10)、建議 reduce;
       只滿足其一時維持 hold 並在作戰計畫中寫明複核條件。
     - 警示:此減碼觸發規則的歷史實測樣本多為反例或流程缺陷
       (曾出現觸發後不跌反漲、複核條件延遲觸發等情形),支持證據並不充分。
       優先做法是「設定量化複核條件持續觀察」而非直接執行減碼;
       若確要建議 reduce,須在理由中說明為何本次證據強於過去的失敗案例。

  5. **高 beta 標的籌碼分歧 → 下修信心、收緊停損**:
     - 波動度偏高的標的出現「投信轉賣、僅外資撐盤」(或反之)時,即使維持 hold,
       也應下修 confidence_level,並在作戰計畫中收緊停損價位。

  6. **重大事件窗口 → 暫停方向性操作**:
     - 已知 FOMC/CPI/關稅公告/法說會等重大事件即將公布但結果未知時,
       籌碼訊號分歧一律維持 hold,不在結果揭曉前做方向性加減碼。

  評分歸因:
  - 凡依本策略調整分數或決策,須在 buy_reason 或訊號歸因中註明「台股法人籌碼」
    與觸發的規則編號(如「籌碼分歧無新聞,依法人籌碼策略規則 1 維持觀望」)。
