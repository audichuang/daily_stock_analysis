# (chip-divergence-no-news-hold 等,2025-01~2026-06 約 30 次演練、80+ 筆建議追蹤驗證)。

name: tw_institutional_chips
display_name: 台股法人籌碼
description: 以三大法人買賣超的方向、延續性與價格/新聞的一致性判讀訊號,防止被單日籌碼雜訊誘導追高或恐慌減碼。僅適用台股。
category: framework
